name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      memo:
        description: "Why this run was started"
        required: true

permissions:
  contents: read

jobs:
  core:
    name: JVM modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The floor for Android Gradle plugin 8.13.
          gradle-version: "8.13"

      - name: Test
        run: |
          gradle --no-daemon --stacktrace \
            :icrc167-core:test :icrc167-crypto:test :icrc167-certificate:test \
            :icrc167-canister-sig:test :icrc167-agent:test

      - name: The auto-merge gate refuses a red check
        # Cheap, and the one thing that would otherwise only be measured by a
        # dependency bump going in over a failing build, as #13 did.
        run: bash scripts/test-head-green-gate.sh

      - name: Compile the Android library, its device tests, and the demo app
        # The device tests only run on the emulator job, which costs a boot. A test that does
        # not even compile should fail here, in two minutes, instead.
        run: gradle --no-daemon --stacktrace :icrc167-android:assembleDebug :icrc167-android:assembleDebugAndroidTest :demo:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            icrc167-core/build/reports/tests/test
            icrc167-crypto/build/reports/tests/test
            icrc167-certificate/build/reports/tests/test
            icrc167-canister-sig/build/reports/tests/test
            icrc167-agent/build/reports/tests/test
          retention-days: 7

  well-known:
    name: Callback origin contract
    runs-on: ubuntu-latest
    # The signer fetches these before it will return a delegation, and it fails closed on a
    # redirect, a wrong content type, or a missing CORS header. Measure them, do not assume.
    if: vars.CALLBACK_ORIGIN != ''
    steps:
      - uses: actions/checkout@v7

      # Deliberately without the expected-list argument: the live origin serves what main
      # deployed, so comparing it against a branch that is editing the list would fail for
      # the wrong reason. The deploy workflow is where that comparison belongs.
      - name: Read both documents back
        env:
          ORIGIN: ${{ vars.CALLBACK_ORIGIN }}
        run: bash scripts/check-callback-origin.sh "$ORIGIN"

  min-sdk:
    name: MIRACL below API 31
    runs-on: ubuntu-latest
    # BIG.java calls Math.multiplyHigh, which Android has only from API 31. D8 has to rewrite
    # it for minSdk 26. If it did not, a real sign-in on an older phone would die inside the
    # pairing check with NoSuchMethodError, and the API 34 emulator in the device tests would
    # never notice: case D stops at the CBOR, long before any pairing.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The floor for Android Gradle plugin 8.13.
          gradle-version: "8.13"

      - name: Build an app that carries MIRACL, and read its dex
        run: |
          set -euo pipefail
          if ! grep -q "Math.multiplyHigh" icrc167-canister-sig/src/miracl/java/org/miracl/core/BLS12381/BIG.java; then
            echo "::error::BIG.java no longer calls multiplyHigh, so this job checks nothing; retire it"
            exit 1
          fi
          gradle --no-daemon --stacktrace :probe:assembleDebug
          dexdump="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)dexdump"
          mkdir -p dex
          unzip -o -q probe/build/outputs/apk/debug/probe-debug.apk 'classes*.dex' -d dex
          for f in dex/classes*.dex; do "$dexdump" -d "$f"; done > dex/dump.txt
          # A call into MIRACL, in the same class-then-dot-then-method form the check below
          # looks for. A class definition alone would not show that form, and without it the
          # absence below would prove nothing: MIRACL missing, or references printed otherwise.
          if ! grep -qF "Lorg/miracl/core/BLS12381/BIG;." dex/dump.txt; then
            echo "::error::no call into MIRACL in the form this check reads, so its absence test would prove nothing"
            exit 1
          fi
          if grep -qF "Ljava/lang/Math;.multiplyHigh" dex/dump.txt; then
            echo "::error::the APK calls Math.multiplyHigh, which does not exist below API 31"
            exit 1
          fi
          echo "MIRACL is in the APK, and no call to Math.multiplyHigh survived dexing for minSdk 26"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      memo:
        description: "Why this run was started"
        required: true

permissions:
  contents: read

jobs:
  core:
    name: JVM modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The floor for Android Gradle plugin 8.13.
          gradle-version: "8.13"

      - name: Test
        run: |
          gradle --no-daemon --stacktrace \
            :icrc167-core:test :icrc167-crypto:test :icrc167-certificate:test \
            :icrc167-canister-sig:test :icrc167-agent:test

      - name: The auto-merge gate refuses a red check
        # Cheap, and the one thing that would otherwise only be measured by a
        # dependency bump going in over a failing build, as #13 did.
        run: bash scripts/test-head-green-gate.sh

      - name: Compile the Android library
        run: gradle --no-daemon --stacktrace :icrc167-android:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            icrc167-core/build/reports/tests/test
            icrc167-crypto/build/reports/tests/test
            icrc167-certificate/build/reports/tests/test
            icrc167-canister-sig/build/reports/tests/test
            icrc167-agent/build/reports/tests/test
          retention-days: 7

  well-known:
    name: Callback origin contract
    runs-on: ubuntu-latest
    # The signer fetches these before it will return a delegation, and it fails closed on a
    # redirect, a wrong content type, or a missing CORS header. Measure them, do not assume.
    if: vars.CALLBACK_ORIGIN != ''
    steps:
      - name: /.well-known/ii-auth-callbacks
        run: |
          set -euo pipefail
          url="${{ vars.CALLBACK_ORIGIN }}/.well-known/ii-auth-callbacks"
          # Ask the way the signer does, from its own origin: a CORS rule that only answers
          # same-origin requests would otherwise pass here and fail at sign-in.
          headers="$(curl -sS -D - -o /tmp/body -H 'Origin: https://id.ai' --max-time 20 "$url")"
          echo "$headers"
          echo "$headers" | head -1 | grep -q ' 200 ' \
            || { echo "::error::expected 200, and no redirect"; exit 1; }
          echo "$headers" | grep -iq '^content-type: *application/json' \
            || { echo "::error::content-type must be application/json"; exit 1; }
          echo "$headers" | grep -iq '^access-control-allow-origin:' \
            || { echo "::error::the signer must be able to read this cross-origin"; exit 1; }
          echo "$headers" | grep -iq '^cache-control:.*no-store'             || echo "::warning::no-store is not set; the signer must see the current list"
          size="$(wc -c < /tmp/body)"
          [ "$size" -le 8192 ]             || { echo "::error::$size bytes is over the 8 KiB the signer reads"; exit 1; }
          jq -e '.callbacks | type == "array" and length > 0' /tmp/body
          jq -e --arg o "${{ vars.CALLBACK_ORIGIN }}" 'all(.callbacks[]; startswith($o + "/"))'             /tmp/body || { echo "::error::an entry is not on this origin"; exit 1; }

      - name: /.well-known/assetlinks.json
        run: |
          set -euo pipefail
          url="${{ vars.CALLBACK_ORIGIN }}/.well-known/assetlinks.json"
          headers="$(curl -sS -D - -o /tmp/links --max-time 20 "$url")"
          echo "$headers"
          echo "$headers" | head -1 | grep -q ' 200 ' \
            || { echo "::error::expected 200, and no redirect"; exit 1; }
          jq -e '.[0].target.package_name' /tmp/links

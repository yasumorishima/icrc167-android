name: Callback origin

# ICRC-167 puts the trust anchor on this origin, so what is actually served decides whether
# sign-in works at all. The deploy is therefore not the end of this job: the same run measures
# the two documents afterwards, the way Internet Identity and Android will read them.

on:
  workflow_dispatch:
    inputs:
      memo:
        description: "Why this run was started"
        required: true
  push:
    branches: [main]
    paths:
      - "callback-origin/**"
      - ".github/workflows/deploy-callback-origin.yml"

permissions:
  contents: read

concurrency: callback-origin

jobs:
  deploy:
    name: Deploy and measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to publish the template
        run: |
          set -euo pipefail
          if grep -q REPLACE callback-origin/.well-known/ii-auth-callbacks; then
            echo "::error::the callback list is still the template; fill in the real origin first"
            exit 1
          fi
          if grep -q REPLACE callback-origin/.well-known/assetlinks.json; then
            echo "::warning::assetlinks.json is still the template, so Android will not route the callback into the app. Internet Identity does not read this file, so the flow can still be exercised in the browser."
          fi

      - name: Deploy
        id: deploy
        env:
          # The CLI reads this itself. Passing --token would put the secret in the process
          # arguments, where anything on the runner can read it.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set on this repository"
            exit 1
          fi
          cd callback-origin
          scope=""
          if [ -n "${VERCEL_SCOPE:-}" ]; then scope="--scope ${VERCEL_SCOPE}"; fi
          url="$(npx --yes vercel@latest deploy --prod --yes $scope | tail -1)"
          echo "deployed to $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # --prod prints the deployment URL, not the stable production domain, and the stable one
      # is what Internet Identity will fetch. Measure that once it is known.
      - name: Which origin to measure
        id: target
        run: |
          set -euo pipefail
          origin="${{ vars.CALLBACK_ORIGIN }}"
          if [ -z "$origin" ]; then
            origin="${{ steps.deploy.outputs.url }}"
            echo "::warning::CALLBACK_ORIGIN is not set, so this measures the deployment URL rather than the origin the signer will fetch"
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: The signer will read this, so read it the way the signer does
        run: |
          set -euo pipefail
          url="${{ steps.target.outputs.origin }}/.well-known/ii-auth-callbacks"
          headers="$(curl -sS -D - -o /tmp/body -H Origin: https://id.ai --max-time 20 "$url")"
          echo "$headers"
          echo "$headers" | head -1 | grep -q " 200 " \
            || { echo "::error::expected 200, and no redirect"; exit 1; }
          echo "$headers" | grep -iq "^content-type: *application/json" \
            || { echo "::error::content-type must be application/json"; exit 1; }
          echo "$headers" | grep -iq "^access-control-allow-origin:" \
            || { echo "::error::the signer must be able to read this cross-origin"; exit 1; }
          jq -e ".callbacks | type == \"array\" and length > 0" /tmp/body

      - name: Android will read this one
        run: |
          set -euo pipefail
          url="${{ steps.target.outputs.origin }}/.well-known/assetlinks.json"
          headers="$(curl -sS -D - -o /tmp/links --max-time 20 "$url")"
          echo "$headers"
          echo "$headers" | head -1 | grep -q " 200 " \
            || { echo "::error::expected 200, and no redirect"; exit 1; }
          jq -e ".[0].target.package_name" /tmp/links

      - name: Where it went
        run: |
          echo "### Callback origin" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository variable CALLBACK_ORIGIN to this if it is not already." >> "$GITHUB_STEP_SUMMARY"

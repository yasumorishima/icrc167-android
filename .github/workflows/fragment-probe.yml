name: Device tests

# Two things that can only be established on a real Android system:
#   1. the URL fragment survives an App Link hand-off — ICRC-167 returns the delegation
#      there and nowhere else, while intent-filter matching ignores the fragment entirely;
#   2. the library completes a whole return trip, including being killed while the browser
#      would be in the foreground.
on:
  push:
    branches: [main]
    # Booting an emulator costs half an hour. Only pay it when something it could
    # actually catch has changed.
    paths:
      - "icrc167-core/**"
      - "icrc167-crypto/**"
      # The Android module verifies canister signatures through these, so a change to either
      # changes what the app accepts.
      - "icrc167-certificate/**"
      - "icrc167-canister-sig/**"
      - "icrc167-android/**"
      - "probe/**"
      - "fake-signer/**"
      - "scripts/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/fragment-probe.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      memo:
        description: "Why this run was started"
        required: true

permissions:
  contents: read

jobs:
  device:
    name: Fragment probe and authentication round trip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The floor for Android Gradle plugin 8.13.
          gradle-version: "8.13"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run both probes on one emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # One script, so that one failing check does not hide the others: the emulator runner
          # stops at the first failing line, and a red instrumented test hid the probes.
          script: bash scripts/device-tests.sh

      - name: Upload the device test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-test-reports
          path: icrc167-android/build/reports/androidTests/connected
          retention-days: 7

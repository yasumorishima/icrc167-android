name: Demo release

# Builds the demo signed with the one key assetlinks.json names, proves that it is, and
# publishes it as a release asset. An Actions artifact would be a zip a phone cannot install
# from, and this account's artifact storage has run out before; a release asset is neither.

on:
  workflow_dispatch:
    inputs:
      memo:
        description: "Why this run was started"
        required: true
      publish:
        description: "Publish the APK as the latest release (otherwise build and check only)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "callback-origin/.well-known/assetlinks.json"
      - "scripts/demo-signing-check.sh"
      - ".github/workflows/demo-release.yml"
  pull_request:
    paths:
      - "demo/**"
      - "callback-origin/.well-known/assetlinks.json"
      - "scripts/demo-signing-check.sh"
      - ".github/workflows/demo-release.yml"

permissions:
  contents: read

concurrency: demo-release

jobs:
  release:
    name: Build, check the signature, publish
    runs-on: ubuntu-latest
    # Pull requests from forks and from Dependabot get no secrets, so there is nothing to sign
    # with. Everywhere else a missing key is an error, never an unsigned build.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Android Gradle plugin 9.4 needs at least 9.6.0.
          gradle-version: "9.6.1"

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEMO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Fail closed: an unsigned or wrongly signed build must never pass for the demo.
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::DEMO_KEYSTORE_BASE64 is not set on this repository"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d | dd of="$RUNNER_TEMP/demo.p12" status=none
          echo "DEMO_KEYSTORE_PATH=$RUNNER_TEMP/demo.p12" | tee -a "$GITHUB_ENV"

      - name: Build the release and the debug APK
        env:
          DEMO_KEYSTORE_PASSWORD: ${{ secrets.DEMO_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :demo:assembleRelease :demo:assembleDebug

      - name: The release is what assetlinks.json names, and the debug build is not
        run: |
          set -euo pipefail
          links=callback-origin/.well-known/assetlinks.json
          bash scripts/demo-signing-check.sh demo/build/outputs/apk/release/demo-release.apk "$links"
          bash scripts/demo-signing-check.sh demo/build/outputs/apk/debug/demo-debug.apk "$links" --expect-mismatch

      - name: Publish
        if: ${{ inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="demo-${SHA:0:7}"
          cp demo/build/outputs/apk/release/demo-release.apk icrc167-demo.apk
          cp icrc167-canister-sig/src/miracl/java/LICENSE.txt MIRACL-LICENSE.txt
          notes="Demo app built from ${SHA}, signed with the key that callback-origin's assetlinks.json names. It ships MIRACL Core under the Apache License 2.0; the licence is attached."
          gh release create "$tag" icrc167-demo.apk MIRACL-LICENSE.txt --latest --target "$SHA" --title "Demo ${tag}" --notes "$notes"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/icrc167-demo.apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/demo.p12"
